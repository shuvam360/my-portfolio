<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (Sleek Obsidian) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2030"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4db"/>
      <stop offset="35%" stop-color="#e5c97b"/>
      <stop offset="70%" stop-color="#c9a74a"/>
      <stop offset="100%" stop-color="#8a6c22"/>
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c97b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e5c97b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Gold Metallic Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Inner Soft Ambient Light -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="url(#glowGrad)" stroke-width="1.5"/>

  <!-- AI / ML Neural Accent Dot -->
  <circle cx="49" cy="15" r="3" fill="url(#goldGrad)"/>
  <circle cx="49" cy="15" r="5.5" fill="none" stroke="#e5c97b" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Elegant Monogram "SD" Text -->
  <text x="30" y="43"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Serif Display', 'Playfair Display', Georgia, serif"
        font-size="28"
        font-weight="800"
        letter-spacing="-1.2"
        fill="url(#goldGrad)"
        text-anchor="middle">SD</text>
</svg>
